name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Runs every OS leg to completion. One leg failing does not cancel the others.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install the package
      run: npm install

    # VS Code's integration tests need a display. Xvfb provides one on Linux.
    - name: Run the tests
      if: runner.os == 'Linux'
      run: xvfb-run -a npm test

    - name: Run the tests
      if: runner.os != 'Linux'
      run: npm test
