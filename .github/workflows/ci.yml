name: Continuous Integration

on:
  push:
    branches:
      - master
      - next_version
  # Every pull request, whatever its base. Stacked PRs target one another's branches, not only
  # master or next_version, and each still needs its own CI run.
  pull_request:
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Runs every OS leg to completion. One leg failing does not cancel the others.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install the package
      run: npm install

    # VS Code's integration tests need a display. Xvfb provides one on Linux.
    - name: Run the tests
      if: runner.os == 'Linux'
      run: xvfb-run -a npm test

    - name: Run the tests
      if: runner.os != 'Linux'
      run: npm test

    # Lint and coverage report findings without failing the job, on one OS only. setup-node's
    # eslint-stylish problem matcher turns ESLint's output into annotations on the PR diff.
    - name: Lint
      if: runner.os == 'Linux'
      continue-on-error: true
      run: npm run lint

    # The coverage table goes to the job summary. The full HTML report is a downloadable artifact.
    - name: Coverage
      if: runner.os == 'Linux'
      run: |
        npm run -s test:coverage | tee coverage-console.txt
        {
          echo '## Unit test coverage'
          echo '```'
          sed -n '/^-----/,$p' coverage-console.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/
