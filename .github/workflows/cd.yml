name: Continuous Delivery

# Release flow:
#   1. Bump "version" in package.json (and add/rename the matching CHANGELOG.md section)
#      in a normal commit to master.
#   2. git tag v<version> (e.g. v2.0.0), or v<version>-pre.<N> (e.g. v2.0.0-pre.1) to iterate on
#      a prerelease first - both share the same Changelog section and package.json version.
#   3. git push --tags
# This workflow validates the tag against package.json, runs the full test suite, packages the
# extension, and creates a GitHub release/pre-release with the .vsix attached and the matching
# Changelog section as the release body. It does NOT publish to the VS Code Marketplace - that
# stays a manual `just publish` (or `npm run publish`) step for now; see the Justfile.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-pre.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Validate the tag matches package.json's version
      run: .github/workflows/validate_tag_version.sh "${{ github.ref_name }}" package.json

    - name: Install the package
      run: npm install

    - name: Run the tests
      run: xvfb-run -a npm test

    - name: Package the extension
      run: npm run package

    - name: Compute the changelog semver core
      id: semver
      run: |
        CORE="${{ github.ref_name }}"
        CORE="${CORE#v}"
        CORE="${CORE%%-*}"
        echo "core=${CORE}" >> "$GITHUB_OUTPUT"

    - name: Extract the changelog section for this release
      id: changelog
      run: |
        if BODY="$(.github/workflows/extract_changelog.sh "${{ steps.semver.outputs.core }}" CHANGELOG.md)"; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          DELIM="CHANGELOG_EOF_$(date +%s)"
          {
            echo "body<<${DELIM}"
            echo "${BODY}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create the release (changelog body)
      if: steps.changelog.outputs.found == 'true'
      uses: softprops/action-gh-release@v3
      with:
        prerelease: ${{ contains(github.ref_name, '-') }}
        body: ${{ steps.changelog.outputs.body }}
        files: '*.vsix'

    - name: Create the release (auto-generated notes)
      if: steps.changelog.outputs.found != 'true'
      uses: softprops/action-gh-release@v3
      with:
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        files: '*.vsix'

    # Publishing to the VS Code Marketplace is intentionally not automated yet - no VSCE_PAT
    # repository secret is configured. Once ready, add that secret and uncomment:
    # - name: Publish to the VS Code Marketplace
    #   run: npm run publish
    #   env:
    #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
