name: Continuous Delivery

# Release flow:
#   1. Bump "version" in package.json. Add or rename the matching CHANGELOG.md section.
#      Commit to master.
#   2. Tag the commit v<version> for a release, or v<version>-pre.<N> for a prerelease.
#   3. Push the tag.
#
# This workflow validates the tag against package.json's version. It runs the test suite. It
# packages the extension. It publishes a GitHub release with the .vsix attached and the matching
# Changelog section as the body.
#
# Marketplace publishing stays manual for now. Run `just publish` locally.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-pre.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # Prevents publishing a release under the wrong version.
    - name: Validate the tag matches package.json's version
      run: .github/workflows/validate_tag_version.sh "${{ github.ref_name }}" package.json

    - name: Install the package
      run: npm install

    # VS Code's integration tests need a display. Xvfb provides one on Linux.
    - name: Run the tests
      run: xvfb-run -a npm test

    - name: Package the extension
      run: npm run package

    # Strips the leading v and any prerelease suffix from the tag.
    - name: Compute the changelog semver core
      id: semver
      run: |
        CORE="${{ github.ref_name }}"
        CORE="${CORE#v}"
        CORE="${CORE%%-*}"
        echo "core=${CORE}" >> "$GITHUB_OUTPUT"

    # Reads the matching section from CHANGELOG.md for the release body.
    - name: Extract the changelog section for this release
      id: changelog
      run: |
        if BODY="$(.github/workflows/extract_changelog.sh "${{ steps.semver.outputs.core }}" CHANGELOG.md)"; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          DELIM="CHANGELOG_EOF_$(date +%s)"
          {
            echo "body<<${DELIM}"
            echo "${BODY}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    # Uses the Changelog section as the release body when one was found.
    - name: Create the release (changelog body)
      if: steps.changelog.outputs.found == 'true'
      uses: softprops/action-gh-release@v3
      with:
        prerelease: ${{ contains(github.ref_name, '-') }}
        body: ${{ steps.changelog.outputs.body }}
        files: '*.vsix'

    # Falls back to GitHub's auto-generated notes when no Changelog section was found.
    - name: Create the release (auto-generated notes)
      if: steps.changelog.outputs.found != 'true'
      uses: softprops/action-gh-release@v3
      with:
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        files: '*.vsix'

    # Marketplace publishing is disabled. No VSCE_PAT secret is configured yet.
    # Add the secret and uncomment this step to enable it.
    # - name: Publish to the VS Code Marketplace
    #   run: npm run publish
    #   env:
    #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
