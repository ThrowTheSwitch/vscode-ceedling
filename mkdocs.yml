# The extension's user documentation site, built from docs/mkdocs/ and versioned with mike, one
# version per extension release. `just docs-build` builds it, and docs/Development.md explains
# deploying it. Ceedling's own site (ThrowTheSwitch/Ceedling) set the pattern.

# Site metadata
site_name: VSCode-Ceedling
site_description: Ceedling's test suite in Visual Studio Code's Testing view
site_url: https://docs.throwtheswitch.org/vscode-ceedling/
repo_url: https://github.com/ThrowTheSwitch/vscode-ceedling
repo_name: ThrowTheSwitch/vscode-ceedling

docs_dir: docs/mkdocs/

# Every problem MkDocs can find in links and nav is a warning, which --strict turns into a failed
# build. By default, a broken #anchor, an absolute or unrecognized link, and a page missing from
# nav are only reported.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# Material theme configuration, in its standard colors
theme:
  name: material
  favicon: assets/images/favicon.png
  custom_dir: docs/overrides  # Template overrides (the outdated-version banner)
  features:
    - navigation.tabs        # Top-level nav rendered as tabs
    - navigation.sections    # Sections rendered as groups in left sidebar
    - navigation.top         # Back-to-top button
    - navigation.indexes     # Section index pages (first item in section = section landing page)
    - navigation.path        # Breadcrumb trail below page title
    - navigation.instant     # Instant navigation with page content swaps (without page reloads)
    - search.suggest         # Autocomplete suggestions in search
    - search.highlight       # Highlight search terms on result pages
    - content.code.copy      # Copy button on code blocks
    - content.code.annotate  # Inline annotation support in code blocks
    - content.tabs.link      # Choosing a tab (e.g. an OS) chooses it in every tab set on the site

# Extra site configuration
extra:
  generator: false  # Suppress "Made with Material for MkDocs" footer text
  version:
    provider: mike  # Versioned documentation deployment via mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sponsors/ThrowTheSwitch
      name: Sponsor ThrowTheSwitch on GitHub

# Plugins
plugins:
  - search  # Full-text search index
  - mike:   # Versioned documentation deployment to gh-pages
      alias_type: symlink
      canonical_version: latest

# Markdown extensions
markdown_extensions:
  - toc:
      toc_depth: 3      # Limits TOC to show headings H1 through H3
                        # (H2 and H3 in reality since H1 is reserved for page titles)
  - admonition          # !!! note / tip / warning / etc. callout blocks
  - attr_list           # { width="320" } attributes on images, e.g. to size a screenshot
  - md_in_html          # Markdown inside raw HTML elements (required for card grids)
  - footnotes
  - pymdownx.emoji:     # Emoji shortcodes (:material-icon:, :fontawesome-icon:, etc.)
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight: # Syntax highlighting for fenced code blocks via Pygments
      use_pygments: true
      anchor_linenums: true
  - pymdownx.superfences:  # Fenced code blocks inside admonitions, tabs, and other nested elements
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite # Inline code syntax highlighting with `#!lang code` syntax
  - pymdownx.tabbed:    # === "Linux" content tabs, e.g. one per OS or coverage tool
      alternate_style: true

nav:
  - Home: index.md
  - How-To:
    - howto/index.md
  - User Manual:
    - manual/index.md
    - Getting Started: manual/getting-started.md
    - Running Tests: manual/running-tests.md
    - Debugging: manual/debugging.md
    - Code Coverage: manual/code-coverage.md
    - Problem Matching: manual/problem-matching.md
    - Configuration: manual/configuration.md
    - Troubleshooting: manual/troubleshooting.md
  - Releases: releases.md
  - Help: help.md
